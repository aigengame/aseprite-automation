name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: release-pr-main
  cancel-in-progress: false

jobs:
  maintain:
    name: Maintain reviewed release change
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the release state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Require the previous reviewed version to be tagged
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(jq -r '."."' .release-please-manifest.json)"
          test -n "$version"
          if [ "$version" = "0.0.0" ] || \
             gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v${version}" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release PR maintenance waits for pending tag \`v${version}\`." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Maintain the reviewed release change
        if: steps.gate.outputs.ready == 'true'
        uses: ./.github/actions/maintain-release-pr
