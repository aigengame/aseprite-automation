name: CI
run-name: ${{ inputs.task == 'build-aseprite' && 'Build Aseprite' || 'CI' }} from ${{ github.ref_name }} (${{ github.event_name }})

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      task:
        description: Verify SPA or prepare the Aseprite binary for later verification.
        type: choice
        required: true
        default: verify
        options:
          - verify
          - build-aseprite
  schedule:
    # GitHub schedules the default branch (main): 03:23 Asia/Shanghai.
    - cron: "23 19 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.task || 'verify' }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ inputs.task == 'build-aseprite' && 'Not requested - Source quality' || 'Source quality' }}
    if: inputs.task != 'build-aseprite'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true

      - name: Set up Python
        uses: ./.github/actions/setup-python-env

      - name: Set up Lua quality tools
        uses: ./.github/actions/setup-lua-quality

      - name: Check lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Check production types
        run: uv run --frozen pyright

      - name: Check Lua source quality
        run: uv run --frozen python scripts/lua_quality.py

  fast-tests:
    name: ${{ inputs.task == 'build-aseprite' && 'Not requested - Fast tests' || 'Fast tests' }}
    if: inputs.task != 'build-aseprite'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true

      - name: Set up Python
        uses: ./.github/actions/setup-python-env

      - name: Run unit and integration tests
        run: uv run --frozen --group test pytest -m "not e2e"

  package:
    name: ${{ inputs.task == 'build-aseprite' && 'Not requested - Build and smoke test distributions' || 'Build and smoke test distributions' }}
    if: inputs.task != 'build-aseprite'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true

      - name: Set up Python
        uses: ./.github/actions/setup-python-env

      - name: Build and verify distributions
        uses: ./.github/actions/verify-python-distributions

      - name: Preserve the verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  aseprite-e2e:
    name: ${{ inputs.task == 'build-aseprite' && 'Not requested - Linux real Aseprite E2E' || 'Linux real Aseprite E2E' }}
    if: inputs.task != 'build-aseprite'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 20 || 40 }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true

      - name: Require main for scheduled verification
        if: github.event_name == 'schedule'
        shell: bash
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Run the headless real-runtime gate
        uses: ./.github/actions/run-linux-aseprite-e2e
        with:
          junit-path: ${{ runner.temp }}/spa-real-aseprite-e2e.xml

      - name: Preserve the E2E report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-real-aseprite-e2e-${{ github.sha }}
          path: ${{ runner.temp }}/spa-real-aseprite-e2e.xml
          if-no-files-found: warn
          overwrite: true
          retention-days: 14

  build-aseprite:
    name: Build Aseprite (manual maintenance)
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'build-aseprite'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out the selected build recipe
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Prepare and verify the Aseprite binary
        uses: ./.github/actions/setup-linux-aseprite
        with:
          build-if-missing: "true"

      - name: Explain cache scope and recovery
        shell: bash
        run: |
          {
            echo "### Aseprite maintenance complete"
            echo "- Build recipe commit: \`$(git rev-parse HEAD)\`"
            echo "- Run ref: \`$GITHUB_REF\`"
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "- Stable runtime: main cache is available to other branches."
            else
              echo "- Provisional branch runtime: this cache cannot supply main."
              echo "- After promotion, run build-aseprite on main to prepare the stable runtime."
            fi
            echo "- Re-run the original failed verification; this maintenance run is not SPA test evidence."
          } >> "$GITHUB_STEP_SUMMARY"
