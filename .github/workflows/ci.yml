name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Source quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: ./.github/actions/setup-python-env

      - name: Check lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Check production types
        run: uv run --frozen pyright

  fast-tests:
    name: Fast tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: ./.github/actions/setup-python-env

      - name: Run unit and integration tests
        run: uv run --frozen --group test pytest -m "not e2e"

  package:
    name: Build and smoke test distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: ./.github/actions/setup-python-env

      - name: Build and verify distributions
        uses: ./.github/actions/verify-python-distributions

      - name: Preserve the verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  aseprite-e2e:
    name: Linux real Aseprite E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run the headless real-runtime gate
        uses: ./.github/actions/run-linux-aseprite-e2e
        with:
          junit-path: ${{ runner.temp }}/spa-real-aseprite-e2e.xml

      - name: Preserve the E2E report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-real-aseprite-e2e-${{ github.sha }}
          path: ${{ runner.temp }}/spa-real-aseprite-e2e.xml
          if-no-files-found: warn
          retention-days: 14
