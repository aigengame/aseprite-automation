name: CI
run-name: CI from ${{ github.ref_name }} (${{ github.event_name }})

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Source quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true

      - name: Set up Python
        uses: ./.github/actions/setup-python-env

      - name: Set up Lua quality tools
        uses: ./.github/actions/setup-lua-quality

      - name: Check lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Check production types
        run: uv run --frozen pyright

      - name: Check Lua source quality
        run: uv run --frozen python scripts/lua_quality.py

  fast-tests:
    name: Fast tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SPA_FAST_TEST_WORKERS: ${{ vars.SPA_FAST_TEST_WORKERS || '4' }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true

      - name: Set up Python
        uses: ./.github/actions/setup-python-env

      - name: Run unit and integration tests
        run: >-
          uv run --frozen --group test pytest -m "not e2e"
          -n "$SPA_FAST_TEST_WORKERS" --dist=load --max-worker-restart=0

  package:
    name: Build and smoke test distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true

      - name: Set up Python
        uses: ./.github/actions/setup-python-env

      - name: Build and verify distributions
        uses: ./.github/actions/verify-python-distributions

      - name: Preserve the verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
