name: Native E2E shards

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      matrix:
        type: string
        required: true

permissions:
  contents: read

jobs:
  shard:
    name: Native shard ${{ matrix.shard_index }}
    runs-on: ubuntu-24.04
    # Caller preparation (3) + parallel shards (34) + aggregation (3) = 40.
    timeout-minutes: 34
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - name: Check out the exact native target
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ fromJSON(inputs.target).sha }}
          lfs: true
          persist-credentials: false

      - name: Run the shared native shard
        uses: ./.github/actions/run-linux-aseprite-e2e
        with:
          target: ${{ inputs.target }}
          shard-index: ${{ matrix.shard_index }}
          shards: ${{ matrix.shards }}
          workers: ${{ matrix.workers }}

      - name: Preserve shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-e2e-${{ github.run_id }}-shard-${{ matrix.shard_index }}
          path: |
            ${{ runner.temp }}/spa-native-e2e/
            !${{ runner.temp }}/spa-native-e2e/shard-*/tmp/**
            !${{ runner.temp }}/spa-native-e2e/shard-*/cache/**
          if-no-files-found: warn
          overwrite: true
          retention-days: 14
