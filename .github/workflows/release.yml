name: Release
run-name: Release ${{ github.ref_name }} @ ${{ github.sha }} (publish=${{ inputs.publish }})

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Create and publish the GitHub Release after verification
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact release commit
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    outputs:
      release_sha: ${{ steps.target.outputs.release_sha }}
    steps:
      - name: Require a main branch dispatch
        id: target
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Release verification must be dispatched from main, not $GITHUB_REF" >&2
            exit 1
          fi
          echo "release_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out the exact release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: ./.github/actions/setup-python-env

      - name: Check source quality
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen pyright

      - name: Run fast tests
        run: uv run --frozen --group test pytest -m "not e2e"

      - name: Run Linux real Aseprite E2E
        uses: ./.github/actions/run-linux-aseprite-e2e
        with:
          junit-path: ${{ runner.temp }}/spa-release-e2e.xml

      - name: Validate reviewed release metadata
        if: inputs.publish
        run: uv run --frozen python scripts/verify_release_metadata.py

      - name: Build wheel and source distribution once
        run: uv build

      - name: Check distribution metadata
        run: uvx --from twine==6.2.0 twine check dist/*

      - name: Install and smoke test the wheel
        shell: bash
        run: |
          wheel_path="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel_path"
          uv venv "$RUNNER_TEMP/spa-release-smoke" --python 3.13
          uv pip install --python "$RUNNER_TEMP/spa-release-smoke/bin/python" "$wheel_path"
          uv run --frozen python scripts/verify_installed_cli.py \
            "$RUNNER_TEMP/spa-release-smoke/bin/spa"

      - name: Preserve the exact-SHA release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/spa-release-e2e.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve the verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  cut-draft:
    name: Cut draft GitHub Release
    if: inputs.publish
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Require main to remain at the verified commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ needs.verify.outputs.release_sha }}
        shell: bash
        run: |
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$main_sha" != "$VERIFIED_SHA" ]; then
            echo "main advanced from verified $VERIFIED_SHA to $main_sha" >&2
            exit 1
          fi

      - name: Create the draft release only
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          skip-github-pull-request: true

      - name: Require the draft to target the verified commit
        env:
          CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          VERIFIED_SHA: ${{ needs.verify.outputs.release_sha }}
        shell: bash
        run: |
          if [ "$CREATED" != "true" ]; then
            echo "release-please did not create a release" >&2
            exit 1
          fi
          if [ "$RELEASE_SHA" != "$VERIFIED_SHA" ]; then
            echo "draft targets $RELEASE_SHA, but verification ran at $VERIFIED_SHA" >&2
            exit 1
          fi

  publish:
    name: Publish GitHub Release
    needs: [verify, cut-draft]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the exact-SHA distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions-${{ needs.verify.outputs.release_sha }}
          path: dist/

      - name: Attach assets and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.cut-draft.outputs.tag_name }}
        shell: bash
        run: |
          test -n "$RELEASE_TAG"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
