name: Release
run-name: Release pipeline from ${{ github.ref_name }} @ ${{ github.sha }} (${{ github.event_name }})

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      shards:
        description: "Shard count override; empty uses SPA_E2E_SHARDS or the shared default"
        type: string
        default: ""
      workers:
        description: "Workers per shard override; empty uses SPA_E2E_WORKERS or the shared default"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  cut-draft:
    name: Cut draft release for a merged Release PR
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      # release-please relabels the merged Release PR when it cuts the release.
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Require a main branch dispatch
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Releases must be dispatched from main, not $GITHUB_REF" >&2
            exit 1
          fi

      - name: Create the draft release only
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          skip-github-pull-request: true

  prepare:
    name: Resolve release verification target and configuration
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.cut-draft.result == 'success' &&
        needs.cut-draft.outputs.release_created == 'true'))
    needs: cut-draft
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      release_sha: ${{ steps.target.outputs.release_sha }}
      target: ${{ steps.target.outputs.target }}
      matrix: ${{ steps.configuration.outputs.matrix }}
    steps:
      - name: Resolve the exact verification target
        id: target
        env:
          SPA_CUT_RESULT: ${{ needs.cut-draft.result }}
          SPA_DRAFT_CREATED: ${{ needs.cut-draft.outputs.release_created }}
          SPA_DRAFT_SHA: ${{ needs.cut-draft.outputs.release_sha }}
          SPA_EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [ "$SPA_EVENT_NAME" = "workflow_dispatch" ]; then
            release_sha="$GITHUB_SHA"
          else
            if [ "$SPA_CUT_RESULT" != "success" ] || \
               [ "$SPA_DRAFT_CREATED" != "true" ] || \
               [ -z "$SPA_DRAFT_SHA" ]; then
              echo "An automatic release requires a successful draft" >&2
              exit 1
            fi
            release_sha="$SPA_DRAFT_SHA"
          fi
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          target="$(jq -cn --arg sha "$release_sha" '{kind: "release", sha: $sha}')"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Check out the exact release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.target.outputs.release_sha }}
          persist-credentials: false

      - name: Configure native shards
        id: configuration
        env:
          SPA_E2E_SHARDS: ${{ inputs.shards || vars.SPA_E2E_SHARDS }}
          SPA_E2E_WORKERS: ${{ inputs.workers || vars.SPA_E2E_WORKERS }}
        run: |
          matrix="$(python3 scripts/native_e2e.py matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  shards:
    if: ${{ always() && needs.prepare.result == 'success' }}
    needs: prepare
    uses: ./.github/workflows/native-e2e-shards.yml
    with:
      target: ${{ needs.prepare.outputs.target }}
      matrix: ${{ needs.prepare.outputs.matrix }}

  quality:
    name: Verify release source and distributions
    if: ${{ always() && needs.prepare.result == 'success' }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          lfs: true
          persist-credentials: false

      - name: Set up Python
        uses: ./.github/actions/setup-python-env

      - name: Set up Lua quality tools
        uses: ./.github/actions/setup-lua-quality

      - name: Check source quality
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen pyright
          uv run --frozen python scripts/lua_quality.py

      - name: Run fast tests
        run: uv run --frozen --group test pytest -m "not e2e"

      - name: Validate reviewed release metadata
        run: uv run --frozen python scripts/verify_release_metadata.py

      - name: Build and verify distributions once
        uses: ./.github/actions/verify-python-distributions

      - name: Preserve the verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions-${{ needs.prepare.outputs.release_sha }}
          path: dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  verify:
    name: Verify exact release commit
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.cut-draft.result == 'success' &&
        needs.cut-draft.outputs.release_created == 'true'))
    needs: [cut-draft, prepare, quality, shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      release_sha: ${{ needs.prepare.outputs.release_sha }}
    steps:
      - name: Require all release verification jobs
        env:
          SPA_PREPARE_RESULT: ${{ needs.prepare.result }}
          SPA_QUALITY_RESULT: ${{ needs.quality.result }}
          SPA_SHARDS_RESULT: ${{ needs.shards.result }}
        run: |
          test "$SPA_PREPARE_RESULT" = success
          test "$SPA_QUALITY_RESULT" = success
          test "$SPA_SHARDS_RESULT" = success

      - name: Check out the verified release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false

      - name: Verify complete native release evidence
        uses: ./.github/actions/verify-native-e2e
        with:
          target: ${{ needs.prepare.outputs.target }}
          matrix: ${{ needs.prepare.outputs.matrix }}

      - name: Preserve the exact-SHA release evidence
        if: ${{ always() && needs.prepare.outputs.release_sha != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ needs.prepare.outputs.release_sha }}
          path: |
            ${{ runner.temp }}/spa-native-target.json
            ${{ runner.temp }}/spa-native-e2e/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  publish-pypi:
    name: Publish verified distributions to PyPI
    # Fail the release tail explicitly when verification fails, so failed-only
    # recovery retains the successful draft and the same release artifacts.
    if: >-
      always() && !cancelled() &&
      github.event_name == 'push' &&
      needs.cut-draft.outputs.release_created == 'true'
    needs: [cut-draft, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/sprite-automation
    env:
      SPA_RELEASE_TAG: ${{ needs.cut-draft.outputs.tag_name }}
    steps:
      - name: Require an approved and verified release
        env:
          SPA_CUT_RESULT: ${{ needs.cut-draft.result }}
          SPA_VERIFY_RESULT: ${{ needs.verify.result }}
          SPA_RELEASE_CREATED: ${{ needs.cut-draft.outputs.release_created }}
          SPA_RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
        shell: bash
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ] || \
             [ "$GITHUB_EVENT_NAME" != push ] || \
             [ "$SPA_RELEASE_CREATED" != true ] || \
             [ "$SPA_CUT_RESULT" != success ] || \
             [ "$SPA_VERIFY_RESULT" != success ] || \
             [ -z "$SPA_RELEASE_TAG" ] || [ -z "$SPA_RELEASE_SHA" ]; then
            echo "PyPI requires a reviewed main release with successful exact-SHA verification." >&2
            echo "Failing explicitly so Re-run failed jobs resumes the release tail." >&2
            exit 1
          fi

      - name: Check out only the reviewed release file verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.verify.outputs.release_sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: scripts/release_distributions.py

      - name: Download the exact-SHA distributions for PyPI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions-${{ needs.verify.outputs.release_sha }}
          path: dist/

      # The stdlib verifier reads archives as data. This job never installs SPA,
      # imports package code, invokes the build backend, or runs project tests.
      - name: Reject conflicting files before PyPI upload
        run: python3 -I scripts/release_distributions.py dist --pypi-tag "$SPA_RELEASE_TAG" --allow-missing

      # PyPA writes attestation sidecars into packages-dir. Keep the verified
      # artifact pair separate for the post-upload check and GitHub publication.
      - name: Prepare the PyPI upload workspace
        run: |
          mkdir pypi-upload
          cp dist/*.whl dist/*.tar.gz pypi-upload/

      - name: Upload the preserved distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: pypi-upload/
          skip-existing: true

      - name: Require the complete matching PyPI release
        run: python3 -I scripts/release_distributions.py dist --pypi-tag "$SPA_RELEASE_TAG"

  publish:
    name: Publish GitHub Release
    if: >-
      always() && !cancelled() &&
      github.event_name == 'push' &&
      needs.cut-draft.outputs.release_created == 'true'
    needs: [cut-draft, verify, publish-pypi]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Require successful draft and verification jobs
        env:
          SPA_CUT_RESULT: ${{ needs.cut-draft.result }}
          SPA_VERIFY_RESULT: ${{ needs.verify.result }}
          SPA_PYPI_RESULT: ${{ needs.publish-pypi.result }}
        shell: bash
        run: |
          if [ "$SPA_CUT_RESULT" != "success" ] || \
             [ "$SPA_VERIFY_RESULT" != "success" ] || \
             [ "$SPA_PYPI_RESULT" != "success" ]; then
            echo "draft: $SPA_CUT_RESULT; verification: $SPA_VERIFY_RESULT; PyPI: $SPA_PYPI_RESULT" >&2
            echo "Failing explicitly so Re-run failed jobs resumes the release tail." >&2
            exit 1
          fi

      - name: Download the exact-SHA distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions-${{ needs.verify.outputs.release_sha }}
          path: dist/

      - name: Attach assets and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          SPA_RELEASE_TAG: ${{ needs.cut-draft.outputs.tag_name }}
        shell: bash
        run: |
          test -n "$SPA_RELEASE_TAG"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          gh release upload "$SPA_RELEASE_TAG" dist/* --clobber \
            --repo "$GITHUB_REPOSITORY"
          gh release edit "$SPA_RELEASE_TAG" --draft=false --latest \
            --repo "$GITHUB_REPOSITORY"

  release-pr:
    name: Maintain reviewed release change
    if: >-
      always() && !cancelled() &&
      github.event_name == 'push' &&
      needs.cut-draft.result == 'success' &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped') &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    needs: [cut-draft, verify, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Check out the release state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Require the previous reviewed version to be tagged
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(jq -r '."."' .release-please-manifest.json)"
          test -n "$version"
          if [ "$version" = "0.0.0" ] || \
             gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v${version}" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release PR maintenance waits for pending tag \`v${version}\`." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Maintain the reviewed release change
        if: steps.gate.outputs.ready == 'true'
        uses: ./.github/actions/maintain-release-pr
