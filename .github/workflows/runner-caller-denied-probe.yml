name: Temporary native caller rejection probe
run-name: Native caller rejection from ${{ github.ref }} (${{ github.event_name }})

# Temporary deployment experiment. Remove this file before merging the branch.
on:
  push:
    branches: [codex/release-runner-validation]
    paths: [.github/workflows/runner-caller-denied-probe.yml]
  pull_request:
    paths: [.github/workflows/runner-caller-denied-probe.yml]

permissions:
  contents: read

jobs:
  denied:
    name: Reject a caller outside the main Release workflow
    uses: aigengame/aseprite-automation/.github/workflows/native-e2e-shards.yml@main
    with:
      target: '{"kind":"release","sha":"${{ github.sha }}"}'
      matrix: '{"include":[{"shard_index":0,"shards":1,"workers":1}]}'
