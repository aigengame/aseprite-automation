name: Temporary runner group rejection probe
run-name: Runner group rejection from ${{ github.ref }} (${{ github.event_name }})

# Temporary deployment experiment. Remove this file before merging the branch.
on:
  push:
    branches: [codex/release-runner-validation]
    paths: [.github/workflows/runner-access-denied-probe.yml]
  pull_request:
    paths: [.github/workflows/runner-access-denied-probe.yml]

permissions: {}

jobs:
  denied:
    name: Reject direct access outside the selected workflow
    runs-on:
      group: spa-release
      labels: [self-hosted, linux]
    timeout-minutes: 1
    steps:
      - name: Fail if the group admits this workflow
        run: |
          printf '%s\n' 'SPA_RUNNER_ACCESS_UNEXPECTEDLY_ADMITTED'
          exit 1
