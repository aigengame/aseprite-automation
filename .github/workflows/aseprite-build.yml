name: Build Aseprite
run-name: Aseprite is provisioned outside GitHub Actions

on:
  workflow_dispatch:

permissions: {}

jobs:
  build-aseprite:
    name: Require host provisioning
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Explain the runtime boundary
        run: |
          echo "::error::Aseprite builds and binary caches are no longer provided by this workflow."
          echo "Provision Aseprite privately on the Release runner. See docs/testing.md#release-runner-setup."
          exit 1
