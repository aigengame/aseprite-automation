name: Verify all native E2E shards
description: Audit complete original test IDs and reports at the caller's exact source target.

inputs:
  target:
    description: The immutable source-target JSON used by every shard.
    required: true
  matrix:
    description: The resolved matrix produced by the shared runner.
    required: true

runs:
  using: composite
  steps:
    - name: Download all shard reports from this run
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: native-e2e-${{ github.run_id }}-shard-*
        merge-multiple: true
        path: ${{ runner.temp }}/spa-native-e2e

    - name: Verify complete native execution
      shell: bash
      env:
        SPA_NATIVE_TARGET_JSON: ${{ inputs.target }}
        SPA_E2E_MATRIX: ${{ inputs.matrix }}
      run: |
        printf '%s\n' "$SPA_NATIVE_TARGET_JSON" > "$RUNNER_TEMP/spa-native-target.json"
        SPA_E2E_SHARDS="$(jq -r '.include[0].shards' <<< "$SPA_E2E_MATRIX")"
        export SPA_E2E_SHARDS
        python3 scripts/native_e2e.py verify \
          --target-file "$RUNNER_TEMP/spa-native-target.json" \
          --output-dir "$RUNNER_TEMP/spa-native-e2e" | tee -a "$GITHUB_STEP_SUMMARY"
