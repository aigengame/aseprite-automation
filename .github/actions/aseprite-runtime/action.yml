name: Host-provisioned Aseprite runtime
description: Verify the runner's private Aseprite installation without downloading or caching it.

outputs:
  executable:
    description: Absolute path to the host-provisioned Aseprite executable.
    value: ${{ steps.expose.outputs.executable }}
  version:
    description: Version reported by the Aseprite executable.
    value: ${{ steps.expose.outputs.version }}

runs:
  using: composite
  steps:
    - name: Validate and expose the headless Aseprite executable
      id: expose
      shell: bash
      run: |
        if [[ "${SPA_TEST_ASEPRITE:-}" != /* ]] || [ ! -x "$SPA_TEST_ASEPRITE" ]; then
          echo "::error::Set SPA_TEST_ASEPRITE in the runner service to an absolute, executable Aseprite path."
          echo "Provision or repair it on the host, then rerun the failed Release jobs. No CI build or cache fallback exists."
          exit 1
        fi
        test -z "${DISPLAY:-}"
        test -z "${WAYLAND_DISPLAY:-}"
        probe_dir="$(mktemp -d "$RUNNER_TEMP/spa-aseprite-probe.XXXXXX")"
        trap 'rm -rf -- "$probe_dir"' EXIT
        mkdir "$probe_dir/user"
        version="$(ASEPRITE_USER_FOLDER="$probe_dir/user" "$SPA_TEST_ASEPRITE" --batch --version)"
        test -n "$version"
        cat > "$probe_dir/probe.lua" <<'LUA'
        assert(app ~= nil, "Aseprite app API is unavailable")
        local output_file = assert(io.open(assert(app.params.output), "w"))
        output_file:write("spa-aseprite-script-ok\n")
        output_file:close()
        LUA
        ASEPRITE_USER_FOLDER="$probe_dir/user" \
          "$SPA_TEST_ASEPRITE" --batch \
          --script-param "output=$probe_dir/result.txt" --script "$probe_dir/probe.lua"
        test "$(cat "$probe_dir/result.txt")" = "spa-aseprite-script-ok"
        echo "executable=$SPA_TEST_ASEPRITE" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"
