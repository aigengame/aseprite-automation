name: Set up the locked Python environment
description: Install the project Python and synchronize every locked dependency group.

inputs:
  working-directory:
    description: Source directory containing the project and its lockfile.
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        version: 0.11.19
        enable-cache: true
        cache-dependency-glob: ${{ inputs.working-directory }}/uv.lock

    - name: Install Python
      shell: bash
      run: uv python install 3.13

    - name: Synchronize the locked environment
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv sync --frozen --all-groups
