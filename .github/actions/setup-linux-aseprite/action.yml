name: Set up Linux Aseprite
description: Build and expose the pinned official Aseprite CLI source release.

inputs:
  aseprite-version:
    description: Official Aseprite source release to build.
    required: false
    default: 1.3.18.5
  source-sha256:
    description: SHA-256 of the official source release archive.
    required: false
    default: 04b0a84617efb3107d380c352ebb0af9eb2633ff4c1a8bfcb671d2a437247d5d

outputs:
  executable:
    description: Absolute path to the cached Aseprite executable.
    value: ${{ steps.expose.outputs.executable }}
  version:
    description: Version reported by the Aseprite executable.
    value: ${{ steps.expose.outputs.version }}

runs:
  using: composite
  steps:
    - name: Resolve the pinned Aseprite paths
      id: paths
      env:
        SPA_ASEPRITE_VERSION: ${{ inputs.aseprite-version }}
      shell: bash
      run: |
        install_dir="$RUNNER_TEMP/spa-aseprite/${SPA_ASEPRITE_VERSION}"
        echo "install-dir=$install_dir" >> "$GITHUB_OUTPUT"
        echo "executable=$install_dir/bin/aseprite" >> "$GITHUB_OUTPUT"

    - name: Install native build and runtime dependencies
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          cmake ninja-build \
          libpixman-1-dev libfreetype6-dev libharfbuzz-dev zlib1g-dev \
          libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev \
          libfontconfig1-dev

    - name: Restore the pinned Aseprite CLI build
      id: cache
      uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: ${{ steps.paths.outputs.install-dir }}
        key: spa-aseprite-cli-${{ runner.os }}-${{ runner.arch }}-${{ inputs.aseprite-version }}-${{ inputs.source-sha256 }}-${{ hashFiles('.github/actions/setup-linux-aseprite/action.yml') }}

    - name: Build the pinned Aseprite CLI
      if: steps.cache.outputs.cache-hit != 'true'
      env:
        SPA_ASEPRITE_INSTALL_DIR: ${{ steps.paths.outputs.install-dir }}
        SPA_ASEPRITE_VERSION: ${{ inputs.aseprite-version }}
        SPA_ASEPRITE_SOURCE_SHA256: ${{ inputs.source-sha256 }}
      shell: bash
      run: |
        archive="$RUNNER_TEMP/Aseprite-v${SPA_ASEPRITE_VERSION}-Source.zip"
        source_dir="$RUNNER_TEMP/aseprite-source"
        build_dir="$RUNNER_TEMP/aseprite-build"

        curl --fail --location --retry 3 \
          --output "$archive" \
          "https://github.com/aseprite/aseprite/releases/download/v${SPA_ASEPRITE_VERSION}/Aseprite-v${SPA_ASEPRITE_VERSION}-Source.zip"
        echo "${SPA_ASEPRITE_SOURCE_SHA256}  $archive" \
          | sha256sum --check --strict
        mkdir -p "$source_dir" "$build_dir" "$SPA_ASEPRITE_INSTALL_DIR/bin"
        unzip -q "$archive" -d "$source_dir"

        cmake -S "$source_dir" -B "$build_dir" -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=clang-18 \
          -DCMAKE_CXX_COMPILER=clang++-18 \
          -DENABLE_TESTS=OFF \
          -DENABLE_SCRIPTING=ON \
          -DENABLE_CCACHE=OFF \
          -DLAF_BACKEND=none
        cmake --build "$build_dir" --target aseprite --parallel 2

        cp "$build_dir/bin/aseprite" "$SPA_ASEPRITE_INSTALL_DIR/bin/aseprite"
        cp -R "$source_dir/data" "$SPA_ASEPRITE_INSTALL_DIR/bin/data"

    - name: Validate and expose the headless Aseprite executable
      id: expose
      env:
        SPA_ASEPRITE_EXECUTABLE: ${{ steps.paths.outputs.executable }}
      shell: bash
      run: |
        probe_script="$RUNNER_TEMP/spa-aseprite-cache-probe.lua"
        probe_result="$RUNNER_TEMP/spa-aseprite-cache-probe.txt"
        probe_user="$RUNNER_TEMP/spa-aseprite-cache-user"
        test -x "$SPA_ASEPRITE_EXECUTABLE"
        test -f "$(dirname "$SPA_ASEPRITE_EXECUTABLE")/data/gui.xml"
        version="$("$SPA_ASEPRITE_EXECUTABLE" --batch --version | head -n 1)"
        test -n "$version"

        rm -f "$probe_result"
        mkdir -p "$probe_user"
        cat > "$probe_script" <<'LUA'
        assert(app ~= nil, "Aseprite app API is unavailable")
        local output_path = assert(app.params.output)
        local output_file = assert(io.open(output_path, "w"))
        output_file:write("spa-aseprite-script-ok\n")
        output_file:close()
        LUA
        ASEPRITE_USER_FOLDER="$probe_user" \
          "$SPA_ASEPRITE_EXECUTABLE" --batch \
          --script-param "output=$probe_result" --script "$probe_script"
        test "$(cat "$probe_result")" = "spa-aseprite-script-ok"

        echo "SPA_TEST_ASEPRITE=$SPA_ASEPRITE_EXECUTABLE" >> "$GITHUB_ENV"
        echo "$(dirname "$SPA_ASEPRITE_EXECUTABLE")" >> "$GITHUB_PATH"
        echo "executable=$SPA_ASEPRITE_EXECUTABLE" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Save the verified Aseprite CLI build
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: ${{ steps.paths.outputs.install-dir }}
        key: ${{ steps.cache.outputs.cache-primary-key }}

    - name: Record the native setup environment
      shell: bash
      env:
        SPA_ASEPRITE_CACHE_HIT: ${{ steps.cache.outputs.cache-hit == 'true' }}
        SPA_ASEPRITE_CACHE_KEY: ${{ steps.cache.outputs.cache-primary-key }}
        SPA_ASEPRITE_REPORTED_VERSION: ${{ steps.expose.outputs.version }}
      run: |
        {
          echo "### Linux Aseprite setup"
          echo "- Commit: \`$(git rev-parse HEAD)\`"
          echo "- Runner: \`$RUNNER_OS $RUNNER_ARCH\`; image \`${ImageOS:-unknown} ${ImageVersion:-unknown}\`"
          echo "- CPUs: $(nproc); memory: $(awk '/MemTotal/ {print $2 " kB"}' /proc/meminfo)"
          echo "- Cache hit: \`$SPA_ASEPRITE_CACHE_HIT\`"
          echo "- Cache key: \`$SPA_ASEPRITE_CACHE_KEY\`"
          echo "- Aseprite: \`$SPA_ASEPRITE_REPORTED_VERSION\`"
        } >> "$GITHUB_STEP_SUMMARY"
