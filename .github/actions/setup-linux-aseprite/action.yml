name: Set up Linux Aseprite
description: Build and expose the pinned official Aseprite CLI source release.

outputs:
  executable:
    description: Absolute path to the cached Aseprite executable.
    value: ${{ steps.expose.outputs.executable }}
  version:
    description: Version reported by the Aseprite executable.
    value: ${{ steps.expose.outputs.version }}

runs:
  using: composite
  steps:
    - name: Install native build and runtime dependencies
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          cmake ninja-build \
          libpixman-1-dev libfreetype6-dev libharfbuzz-dev zlib1g-dev \
          libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev \
          libfontconfig1-dev

    - name: Restore the pinned Aseprite CLI build
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.tool_cache }}/spa-aseprite/1.3.18.5
        key: spa-aseprite-cli-${{ runner.os }}-${{ runner.arch }}-1.3.18.5-04b0a84617efb310

    - name: Build the pinned Aseprite CLI
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        archive="$RUNNER_TEMP/Aseprite-v1.3.18.5-Source.zip"
        source_dir="$RUNNER_TEMP/aseprite-source"
        build_dir="$RUNNER_TEMP/aseprite-build"
        install_dir="$RUNNER_TOOL_CACHE/spa-aseprite/1.3.18.5"

        curl --fail --location --retry 3 \
          --output "$archive" \
          https://github.com/aseprite/aseprite/releases/download/v1.3.18.5/Aseprite-v1.3.18.5-Source.zip
        echo "04b0a84617efb3107d380c352ebb0af9eb2633ff4c1a8bfcb671d2a437247d5d  $archive" \
          | sha256sum --check --strict
        mkdir -p "$source_dir" "$build_dir" "$install_dir/bin"
        unzip -q "$archive" -d "$source_dir"

        cmake -S "$source_dir" -B "$build_dir" -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DENABLE_TESTS=OFF \
          -DENABLE_SCRIPTING=ON \
          -DENABLE_CCACHE=OFF \
          -DLAF_BACKEND=none
        cmake --build "$build_dir" --target aseprite --parallel 2

        cp "$build_dir/bin/aseprite" "$install_dir/bin/aseprite"
        cp -R "$source_dir/data" "$install_dir/bin/data"

    - name: Expose the headless Aseprite executable
      id: expose
      shell: bash
      run: |
        executable="$RUNNER_TOOL_CACHE/spa-aseprite/1.3.18.5/bin/aseprite"
        test -x "$executable"
        test -f "$(dirname "$executable")/data/gui.xml"
        version="$($executable --batch --version | head -n 1)"
        test -n "$version"
        echo "SPA_TEST_ASEPRITE=$executable" >> "$GITHUB_ENV"
        echo "$(dirname "$executable")" >> "$GITHUB_PATH"
        echo "executable=$executable" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"
