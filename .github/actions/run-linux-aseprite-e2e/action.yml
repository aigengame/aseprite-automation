name: Run Linux real Aseprite E2E
description: Run the SPA batch scripting path without a graphical display.

inputs:
  junit-path:
    description: Absolute output path for the pytest JUnit report.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: ./.github/actions/setup-python-env

    - name: Set up real Aseprite
      id: aseprite
      uses: ./.github/actions/setup-linux-aseprite

    - name: Verify the headless batch environment
      shell: bash
      run: |
        test -z "${DISPLAY:-}"
        test -z "${WAYLAND_DISPLAY:-}"
        "$SPA_TEST_ASEPRITE" --batch --version

    - name: Install the wheel-only SPA CLI for handler evidence
      shell: bash
      run: |
        uv build
        uv export --frozen --no-dev --no-emit-project \
          --format requirements-txt --output-file "$RUNNER_TEMP/spa-runtime-requirements.txt"
        uv venv --python 3.13 "$RUNNER_TEMP/spa-e2e-wheel"
        uv pip sync --python "$RUNNER_TEMP/spa-e2e-wheel/bin/python" \
          "$RUNNER_TEMP/spa-runtime-requirements.txt"
        uv pip install --python "$RUNNER_TEMP/spa-e2e-wheel/bin/python" \
          --no-deps dist/*.whl
        echo "SPA_TEST_INSTALLED_CLI=$RUNNER_TEMP/spa-e2e-wheel/bin/spa" >> "$GITHUB_ENV"

    - name: Run real Aseprite E2E tests
      shell: bash
      env:
        SPA_E2E_JUNIT_PATH: ${{ inputs.junit-path }}
      run: |
        pytest_status=0
        uv run --frozen --group test pytest -m "e2e and not slow" -rs \
          --junitxml="$SPA_E2E_JUNIT_PATH" || pytest_status=$?
        uv run --frozen python scripts/verify_pytest_execution.py \
          "$SPA_E2E_JUNIT_PATH"
        exit "$pytest_status"

    - name: Record Linux real-runtime evidence
      shell: bash
      run: |
        tested_sha="$(git rev-parse HEAD)"
        {
          echo "### Linux real Aseprite E2E"
          echo "- Commit: \`${tested_sha}\`"
          echo "- Trigger: \`${GITHUB_EVENT_NAME}\`"
          echo "- Selection: \`e2e and not slow\`; complete example rebuilds are local opt-in checks"
          echo "- Executable: \`${{ steps.aseprite.outputs.executable }}\`"
          echo "- Aseprite: \`${{ steps.aseprite.outputs.version }}\`"
          echo "- Display: \`DISPLAY\` and \`WAYLAND_DISPLAY\` absent"
          echo "- Path: real \`--batch --script\` through project and wheel-installed SPA CLIs"
        } >> "$GITHUB_STEP_SUMMARY"
