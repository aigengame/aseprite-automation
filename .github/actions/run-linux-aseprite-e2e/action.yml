name: Run Linux real Aseprite E2E
description: Run the SPA batch scripting path without a graphical display.

inputs:
  source-directory:
    description: Checked-out test source, separate from the trusted workflow actions.
    required: false
    default: .
  shard-index:
    description: Zero-based shard index from the shared runner matrix.
    required: true
  shards:
    description: Resolved total shard count.
    required: true
  target:
    description: Immutable source-target JSON resolved by the caller.
    required: true

runs:
  using: composite
  steps:
    - name: Set up real Aseprite
      id: aseprite
      uses: ./.github/actions/aseprite-runtime

    - name: Set up Python
      uses: ./.github/actions/setup-python-env
      with:
        working-directory: ${{ inputs.source-directory }}

    - name: Install the wheel-only SPA CLI for handler evidence
      shell: bash
      working-directory: ${{ inputs.source-directory }}
      run: |
        uv build
        uv export --frozen --no-dev --no-emit-project \
          --format requirements-txt --output-file "$RUNNER_TEMP/spa-runtime-requirements.txt"
        uv venv --python 3.13 "$RUNNER_TEMP/spa-e2e-wheel"
        uv pip sync --python "$RUNNER_TEMP/spa-e2e-wheel/bin/python" \
          "$RUNNER_TEMP/spa-runtime-requirements.txt"
        uv pip install --python "$RUNNER_TEMP/spa-e2e-wheel/bin/python" \
          --no-deps dist/*.whl
        uv run --frozen python scripts/verify_installed_cli.py \
          "$RUNNER_TEMP/spa-e2e-wheel/bin/spa"
        echo "SPA_TEST_INSTALLED_CLI=$RUNNER_TEMP/spa-e2e-wheel/bin/spa" >> "$GITHUB_ENV"

    - name: Run real Aseprite E2E tests
      shell: bash
      working-directory: ${{ inputs.source-directory }}
      env:
        SPA_E2E_SHARD_INDEX: ${{ inputs.shard-index }}
        SPA_E2E_SHARDS: ${{ inputs.shards }}
        SPA_NATIVE_TARGET_JSON: ${{ inputs.target }}
      run: |
        printf '%s\n' "$SPA_NATIVE_TARGET_JSON" > "$RUNNER_TEMP/spa-native-target.json"
        uv run --frozen --group test python scripts/native_e2e.py run \
          --shard-index "$SPA_E2E_SHARD_INDEX" \
          --target-file "$RUNNER_TEMP/spa-native-target.json" \
          --output-dir "$RUNNER_TEMP/spa-native-e2e"

    - name: Record Linux real-runtime evidence
      shell: bash
      working-directory: ${{ inputs.source-directory }}
      run: |
        tested_sha="$(git rev-parse HEAD)"
        {
          echo "### Linux real Aseprite E2E"
          echo "- Commit: \`${tested_sha}\`"
          echo "- Trigger: \`${GITHUB_EVENT_NAME}\`"
          echo "- Selection: \`e2e and not slow\`; complete example rebuilds are local opt-in checks"
          workers="$(jq -r .workers "$RUNNER_TEMP/spa-native-e2e/shard-${{ inputs.shard-index }}/result.json")"
          echo "- Shard: ${{ inputs.shard-index }}; total shards: ${{ inputs.shards }}; workers on this runner: $workers"
          echo "- Executable: \`${{ steps.aseprite.outputs.executable }}\`"
          echo "- Aseprite: \`${{ steps.aseprite.outputs.version }}\`"
          echo "- Display: \`DISPLAY\` and \`WAYLAND_DISPLAY\` absent"
          echo "- Path: real \`--batch --script\` through project and wheel-installed SPA CLIs"
        } >> "$GITHUB_STEP_SUMMARY"
