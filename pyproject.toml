[build-system]
requires = ["uv_build==0.11.19"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "spa"

[project]
name = "aseprite-automation"
version = "0.1.0"
description = "Agent-facing automation for Aseprite"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.11,<3",
  "typer>=0.16,<1",
]

[project.scripts]
spa = "spa.bootstrap:main"

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "ruff==0.16.8",
    "twine==6.2.0",
]
test = ["pytest>=8,<10", "jsonschema>=4,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
  "e2e: uses the installed SPA CLI with a real Aseprite executable",
]

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
