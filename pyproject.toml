[build-system]
requires = ["uv_build==0.11.19"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "spa"

[project]
name = "aseprite-automation"
version = "0.2.0"
description = "Agent-facing automation for Aseprite"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "pillow>=12,<13",
  "pydantic>=2.11,<3",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3", "jsonschema>=4,<5"]

[project.scripts]
spa = "spa.bootstrap:main"
spa-mcp = "spa.mcp_bootstrap:main"

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "ruff==0.16.8",
    "twine==6.2.0",
]
test = [
    "mcp>=2.3,<3",
    "pytest>=8,<10",
    "jsonschema>=4,<5",
    "pytest-xdist>=3.8,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
  "e2e: uses installed SPA or packaged Kernel code with a real Aseprite executable",
  "slow: complete example rebuild; run locally on demand, excluded from automated CI and release",
]

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
