[build-system]
requires = ["uv_build==0.11.19"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "spa"
source-include = ["THIRD_PARTY_NOTICES.md"]

[project]
name = "aseprite-automation"
version = "0.4.1"
description = "Aseprite automation for AI agents. Create, edit, verify, and export pixel art, sprite animations, and tilesets through a CLI, Agent Skill, or MCP server."
readme = "README.md"
license = "MIT AND CC0-1.0"
license-files = ["LICENSE", "LICENSES/CC0-1.0.txt"]
authors = [{name = "aigengame"}]
keywords = [
  "aseprite",
  "pixel-art",
  "sprite-animation",
  "sprite-sheet",
  "tileset",
  "game-assets",
  "ai-agent",
  "ai-game-development",
  "cli",
  "agent-skill",
  "mcp",
  "mcp-server",
  "model-context-protocol",
  "asset-pipeline",
]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
]
requires-python = ">=3.13"
dependencies = [
  "pillow>=12,<13",
  "pydantic>=2.11,<3",
  "typer>=0.16,<1",
]

[project.urls]
Repository = "https://github.com/aigengame/aseprite-automation"
Issues = "https://github.com/aigengame/aseprite-automation/issues"
Changelog = "https://github.com/aigengame/aseprite-automation/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3", "jsonschema>=4,<5"]

[project.scripts]
spa = "spa.bootstrap:main"
spa-mcp = "spa.mcp_bootstrap:main"

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "ruff==0.16.8",
    "twine==6.2.0",
]
test = [
    "mcp>=2.3,<3",
    "pytest>=8,<10",
    "jsonschema>=4,<5",
    "pytest-xdist>=3.8,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
  "e2e: uses installed SPA or packaged Kernel code with a real Aseprite executable",
  "slow: complete example rebuild; run locally on demand, excluded from automated CI and release",
]

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
